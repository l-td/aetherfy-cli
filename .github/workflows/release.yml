name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version: '1.24'
          cache: true

      - name: Run tests
        run: go test -v ./...

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94  # v7.2.3
        with:
          distribution: goreleaser
          version: v2.17.0
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Uncomment if you want to publish to Homebrew tap
          # HOMEBREW_TAP_GITHUB_TOKEN: ${{ secrets.HOMEBREW_TAP_GITHUB_TOKEN }}

  # Optional: Update Homebrew tap after release
  # homebrew:
  #   name: Update Homebrew
  #   runs-on: ubuntu-latest
  #   needs: release
  #   steps:
  #     - name: Update Homebrew formula
  #       uses: mislav/bump-homebrew-formula-action@9d4d820e1d00b99927bd36e67d41fff1cfc8bd07  # v2.4 — re-verify before enabling
  #       with:
  #         formula-name: afy
  #         homebrew-tap: aetherfy/homebrew-tap
  #       env:
  #         COMMITTER_TOKEN: ${{ secrets.HOMEBREW_TAP_GITHUB_TOKEN }}

  # First real execution of scripts/install.sh's download path. Everything past
  # detect_platform can only run against published assets, so it runs HERE, on
  # every release, the moment those assets exist — machinery instead of anyone's
  # memory. One job pins the whole chain: asset name, checksums.txt, the tar
  # layout (./afy at the root), and that the ldflags actually stamped the
  # version. Uses the version-pinned URL path (not /latest) so there is no
  # redirect race with the release that just published.
  smoke:
    name: Install smoke (published assets)
    runs-on: ubuntu-latest
    needs: release
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install from the release just published
        env:
          AETHERFY_VERSION: ${{ github.ref_name }}
        run: |
          export AETHERFY_INSTALL_DIR="$RUNNER_TEMP/bin"
          mkdir -p "$AETHERFY_INSTALL_DIR"
          bash scripts/install.sh
          "$AETHERFY_INSTALL_DIR/afy" version
          "$AETHERFY_INSTALL_DIR/afy" version | grep -F "${AETHERFY_VERSION#v}"
          # `afy update --check` must report the release that just published as
          # already-current. With a single release that is the only end-to-end
          # assertion available, and it proves the one thing no unit test can:
          # that github.com/<repo>/releases/latest really redirects to a
          # /releases/tag/<tag> URL naming this tag.
          #
          # RETRIED, because /releases/latest is the one endpoint this job cannot
          # pin to a version: the install above deliberately uses the tag URL to
          # avoid a redirect race, and this check cannot. GitHub updates the
          # latest-release pointer a moment after the release publishes, so a
          # single attempt would red a perfectly correct release. ~30s is far
          # longer than the lag has ever been and still fails a real break.
          #
          # SKIPPED for pre-release tags. goreleaser's `prerelease: auto`
          # publishes v0.2.0-rc.1 as a pre-release, and /releases/latest points
          # PAST pre-releases at the newest stable one — so the check would
          # correctly report a different version and fail the release for being
          # right.
          case "$AETHERFY_VERSION" in
            *-*)
              echo "pre-release tag $AETHERFY_VERSION: /releases/latest points past it, skipping"
              ;;
            *)
              current=""
              for attempt in 1 2 3 4 5 6; do
                out="$("$AETHERFY_INSTALL_DIR/afy" update --check 2>&1 || true)"
                if printf '%s\n' "$out" | grep -qF "already on ${AETHERFY_VERSION}"; then
                  current=yes
                  printf '%s\n' "$out"
                  break
                fi
                echo "attempt ${attempt}/6: /releases/latest has not caught up with ${AETHERFY_VERSION} yet:"
                printf '%s\n' "$out"
                sleep 5
              done
              if [ -z "$current" ]; then
                echo "FAILED: 'afy update --check' never reported ${AETHERFY_VERSION} as current."
                echo "Either /releases/latest does not resolve to this tag, or --check is broken."
                exit 1
              fi
              ;;
          esac
