name: CI

on:
  push:
    branches: [main, develop]

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version: '1.24'
          cache: true

      - name: Download dependencies
        run: go mod download

      - name: Verify dependencies
        run: go mod verify

      - name: Run tests
        run: go test -v -race -coverprofile=coverage.out ./...

      - name: Upload coverage
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5  # v7.1.1
        with:
          version: v11.3.1
          files: ./coverage.out
          fail_ci_if_error: false

  # THE GOOS-SPECIFIC HALF. internal/release/replace.go branches on
  # runtime.GOOS == "windows" — the backup file Windows keeps locked, and the
  # not-writable message that says Administrator rather than sudo. The Test
  # job above is ubuntu-only and no build tag targets Windows, so until this
  # job existed those branches ran nowhere: not in CI, and not in the release
  # smoke, which only invokes the built binary.
  #
  # NO -race HERE, and that is not an oversight. The race detector needs cgo
  # and a C toolchain; the ubuntu leg above runs it, and a data race is not
  # OS-specific enough to be worth a second toolchain. What this leg is for is
  # the code that only compiles and runs on Windows.
  test-windows:
    name: Test (Windows)
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version: '1.24'
          cache: true

      - name: Run tests
        run: go test -v ./...

  # THE DARWIN HALF. goreleaser publishes darwin/amd64 and darwin/arm64, and
  # until this job no test had ever run on a Mac: the code that branches on
  # runtime.GOOS == "darwin" (the config directory, which skips Linux's
  # XDG_CONFIG_HOME, and `open` for the browser) and everything else ran only
  # on Linux and Windows. macos-latest is Apple Silicon, the arm64 build most
  # Mac users install. Free: this repository is public.
  #
  # -race HERE: the macOS runner ships clang, so cgo works, and the race
  # detector on a second OS costs nothing extra.
  test-macos:
    name: Test (macOS)
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version: '1.24'
          cache: true

      - name: Run tests
        run: go test -v -race ./...

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version: '1.24'
          cache: true

      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@d6238b002a20823d52840fda27e2d4891c5952dc  # v4.0.1
        with:
          version: v1.64.8
          args: --timeout=5m

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [test, test-macos, lint]
    strategy:
      matrix:
        goos: [linux, darwin, windows]
        goarch: [amd64, arm64]
        exclude:
          - goos: windows
            goarch: arm64
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version: '1.24'
          cache: true

      - name: Build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: |
          BINARY_NAME=afy
          if [ "$GOOS" = "windows" ]; then
            BINARY_NAME=afy.exe
          fi
          go build -ldflags="-s -w" -o dist/${BINARY_NAME}-${{ matrix.goos }}-${{ matrix.goarch }} ./cmd/afy

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: afy-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/

  goreleaser-check:
    name: GoReleaser config
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version: '1.24'
      - name: Validate .goreleaser.yaml
        uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de  # v7.3.0
        with:
          distribution: goreleaser
          version: v2.17.0
          args: check
