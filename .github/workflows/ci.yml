name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version: '1.24'
          cache: true

      - name: Download dependencies
        run: go mod download

      - name: Verify dependencies
        run: go mod verify

      - name: Run tests
        run: go test -v -race -coverprofile=coverage.out ./...

      - name: Upload coverage
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f  # v7.0.0
        with:
          version: v11.3.1
          files: ./coverage.out
          fail_ci_if_error: false

  # THE GOOS-SPECIFIC HALF. internal/release/replace.go branches on
  # runtime.GOOS == "windows" — the backup file Windows keeps locked, and the
  # not-writable message that says Administrator rather than sudo. The Test
  # job above is ubuntu-only and no build tag targets Windows, so until this
  # job existed those branches ran nowhere: not in CI, and not in the release
  # smoke, which only invokes the built binary.
  #
  # NO -race HERE, and that is not an oversight. The race detector needs cgo
  # and a C toolchain; the ubuntu leg above runs it, and a data race is not
  # OS-specific enough to be worth a second toolchain. What this leg is for is
  # the code that only compiles and runs on Windows.
  test-windows:
    name: Test (Windows)
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version: '1.24'
          cache: true

      - name: Run tests
        run: go test -v ./...

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version: '1.24'
          cache: true

      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@d6238b002a20823d52840fda27e2d4891c5952dc  # v4.0.1
        with:
          version: v1.64.8
          args: --timeout=5m

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [test, lint]
    strategy:
      matrix:
        goos: [linux, darwin, windows]
        goarch: [amd64, arm64]
        exclude:
          - goos: windows
            goarch: arm64
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version: '1.24'
          cache: true

      - name: Build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: |
          BINARY_NAME=afy
          if [ "$GOOS" = "windows" ]; then
            BINARY_NAME=afy.exe
          fi
          go build -ldflags="-s -w" -o dist/${BINARY_NAME}-${{ matrix.goos }}-${{ matrix.goarch }} ./cmd/afy

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: afy-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/

  goreleaser-check:
    name: GoReleaser config
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version: '1.24'
      - name: Validate .goreleaser.yaml
        uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94  # v7.2.3
        with:
          distribution: goreleaser
          version: v2.17.0
          args: check
