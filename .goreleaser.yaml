# GoReleaser configuration
# Documentation: https://goreleaser.com

version: 2

before:
  hooks:
    - go mod tidy

builds:
  - id: afy
    binary: afy
    main: .
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    ignore:
      - goos: windows
        goarch: arm64
    ldflags:
      - -s -w
      - -X github.com/aetherfy/cli/pkg/version.Version={{.Version}}
      - -X github.com/aetherfy/cli/pkg/version.Commit={{.Commit}}
      - -X github.com/aetherfy/cli/pkg/version.BuildDate={{.Date}}

archives:
  - id: default
    formats:
      - tar.gz
    name_template: "{{ .ProjectName }}-{{ .Os }}-{{ .Arch }}"
    format_overrides:
      - goos: windows
        formats:
          - zip

checksum:
  name_template: 'checksums.txt'

snapshot:
  version_template: "{{ incpatch .Version }}-dev"

changelog:
  sort: asc
  filters:
    exclude:
      - '^docs:'
      - '^test:'
      - '^chore:'
      - Merge pull request
      - Merge branch

# No Homebrew tap yet. The block below named `aetherfy/homebrew-tap`, an org and
# repository that do not exist, so the first release would have failed trying to
# push a cask into it. Restore it — with a tap repository that exists — when
# there is one; until then the README documents build-from-source only.
#
# homebrew_casks:
#   - name: afy
#     binaries:
#       - afy
#     repository:
#       owner: <tap-owner>
#       name: homebrew-tap
#     homepage: https://aetherfy.com
#     description: "Aetherfy CLI - Deploy and manage AI agents"

release:
  # The real repository (git remote origin). This said `aetherfy/cli`, which
  # does not exist. Note the Go MODULE path is still github.com/aetherfy/cli —
  # that is an import path baked into every file, renamed separately or not at
  # all; it does not have to match the release target for goreleaser, but it
  # does break `go install`, which is why the README does not suggest it.
  github:
    owner: l-td
    name: aetherfy-cli
  draft: false
  prerelease: auto
  name_template: "v{{.Version}}"
