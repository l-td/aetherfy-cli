# GoReleaser configuration
# Documentation: https://goreleaser.com

version: 2

# Release assets are named from this ({{ .ProjectName }}-<os>-<arch>), and
# scripts/install.sh constructs exactly `afy-<os>-<arch>` URLs. Left unset,
# goreleaser infers "aetherfy-cli" and every one of those URLs 404s. Never
# rename it once the first release has shipped.
project_name: afy

before:
  hooks:
    - go mod tidy

builds:
  - id: afy
    binary: afy
    main: ./cmd/afy
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    ignore:
      - goos: windows
        goarch: arm64
    ldflags:
      - -s -w
      - -X github.com/l-td/aetherfy-cli/pkg/version.Version={{.Version}}
      - -X github.com/l-td/aetherfy-cli/pkg/version.Commit={{.Commit}}
      - -X github.com/l-td/aetherfy-cli/pkg/version.BuildDate={{.Date}}

archives:
  - id: default
    formats:
      - tar.gz
    name_template: "{{ .ProjectName }}-{{ .Os }}-{{ .Arch }}"
    format_overrides:
      - goos: windows
        formats:
          - zip

checksum:
  name_template: 'checksums.txt'

snapshot:
  version_template: "{{ incpatch .Version }}-dev"

changelog:
  sort: asc
  filters:
    exclude:
      - '^docs:'
      - '^test:'
      - '^chore:'
      - Merge pull request
      - Merge branch

# No Homebrew tap yet. The block below named `aetherfy/homebrew-tap`, an org and
# repository that do not exist, so the first release would have failed trying to
# push a cask into it. Restore it — with a tap repository that exists — when
# there is one; until then the README documents build-from-source only.
#
# homebrew_casks:
#   - name: afy
#     binaries:
#       - afy
#     repository:
#       owner: <tap-owner>
#       name: homebrew-tap
#     homepage: https://aetherfy.com
#     description: "Aetherfy CLI - Deploy and manage AI agents"

release:
  # The real repository (git remote origin). This said `aetherfy/cli`, which
  # does not exist — and the module path said the same, in a GitHub org we do
  # not own. Both now name this repository, so the ldflags above resolve and
  # `go install` is possible for the first time.
  github:
    owner: l-td
    name: aetherfy-cli
  draft: false
  prerelease: auto
  name_template: "v{{.Version}}"
