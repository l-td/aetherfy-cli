# GoReleaser configuration
# Documentation: https://goreleaser.com

version: 2

before:
  hooks:
    - go mod tidy

builds:
  - id: afy
    binary: afy
    main: .
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    ignore:
      - goos: windows
        goarch: arm64
    ldflags:
      - -s -w
      - -X github.com/aetherfy/cli/pkg/version.Version={{.Version}}
      - -X github.com/aetherfy/cli/pkg/version.Commit={{.Commit}}
      - -X github.com/aetherfy/cli/pkg/version.BuildDate={{.Date}}

archives:
  - id: default
    formats:
      - tar.gz
    name_template: "{{ .ProjectName }}-{{ .Os }}-{{ .Arch }}"
    format_overrides:
      - goos: windows
        formats:
          - zip

checksum:
  name_template: 'checksums.txt'

snapshot:
  version_template: "{{ incpatch .Version }}-dev"

changelog:
  sort: asc
  filters:
    exclude:
      - '^docs:'
      - '^test:'
      - '^chore:'
      - Merge pull request
      - Merge branch

brews:
  - name: afy
    repository:
      owner: aetherfy
      name: homebrew-tap
    directory: Formula
    homepage: https://aetherfy.run
    description: "Aetherfy CLI - Deploy and manage AI agents"
    license: "Apache-2.0"
    install: |
      bin.install "afy"
    test: |
      system "#{bin}/afy", "version"

release:
  github:
    owner: aetherfy
    name: cli
  draft: false
  prerelease: auto
  name_template: "v{{.Version}}"
